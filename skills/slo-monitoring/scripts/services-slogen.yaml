# services-slogen.yaml
# -----------------------------------------------------------------------------
# Источник правды: список сервисов, для которых генерируется SLO-мониторинг
# (sloth.yaml / slo.yaml / alerts.yaml).
#
# Поля:
#   name         — уникальное имя сервиса (база каталога ./apps/<company>/<name>)
#   namespace    — kubernetes namespace (ИС)
#   company      — компания (smkt | sbl | mm | kpr | ecomtech). Определяет
#                  helm-репозиторий: git.ecom.tech/ecom/cicd/<company>/helm,
#                  который клонируется в ./helm/<company>.
#   repo         — git-url репозитория сервиса (клонируется в ./apps/)
#   profile      — slo-kit профиль (нормализуется при генерации)
#   team         — команда
#   cost_centre  — cost centre
#   helm         — список каталогов в helm-репо <company>, куда копируется
#                  sloth.yaml (пути относительно корня ./helm/<company>).
#
# При обходе всегда переключаемся на master + git pull, затем создаётся
# уникальная ветка feature/sloth-<дата-время>, чтобы не было пересечений по
# веткам между запусками.
# -----------------------------------------------------------------------------

services:
