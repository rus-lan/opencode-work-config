# Шаблон конфигурации проекта. Копируется в is.yaml командой `make init`.
#
# is.yaml — локальный (не версионируемый) список ИС и адрес SSoT. Здесь только
# переопределения: product/teamName по умолчанию берутся из SSoT (base.yaml ИС).
#
# Шаблон пустой: активных ИС нет, чтобы свежий проект начинался без выдуманных
# данных. Первую ИС заводит `make scaffold IS=<name_is>.<mm|smkt>` — он создаёт
# папку is/<код>/ и дописывает запись сюда (идемпотентно).
is:
  # Код ИС = <name_is>.<контур>, где контур — mm или smkt. Запись без
  # переопределений — просто `код:`. Примеры (раскомментируйте и замените
  # demo.mm на код своей ИС):
  #   demo.mm:
  #   erm.mm:
  #     product: E001        # код продукта (переопределяет SSoT)
  #     teamName: T100       # код команды (переопределяет SSoT)
  # Исключение ИС из расчёта (вердикт SKIPPED вместо BLOCKED). Допустимые ключи
  # записи: product, teamName, excluded, reason; любой другой — ERROR.
  # Приоритет: is.yaml > catalog.yaml. `excluded: false` здесь явно включает ИС
  # обратно, даже если в catalog.yaml стоит excluded: true.
  # is.yaml не версионируется, поэтому исключение действует только на этой
  # машине. Для общего (версионируемого) исключения:
  #   make exclude IS=<код> REASON="<причина>" EXCLUDE_SCOPE=catalog
  # foo.mm:
  #   excluded: true
  #   reason: "нет владельца данных; вопрос на PdM"
ssot:
  # URL SSoT-репозитория; проверяется доступность (`git ls-remote` в
  # `prepare`), клон не создаётся.
  # Схема обязательна: https://, ssh:// или git@host:path.
  url: ""
