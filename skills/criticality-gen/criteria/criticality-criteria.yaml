    source_artifact: "docs/reference/calculator/калькулятор критичности упрощенный.xlsx"
    note: "Расчет!B35:C39. Балл -> код уровня калькулятора. «MC+» — уровень калькулятора; в паспорт пишется SSoT-уровень по levels.dochub_to_ssot (Mission critical), «калькулятор: MC+» фиксируется в score_trace/GENERATION.md."
    map:
      "1": OP
      "2": BO
      "3": BC
      "4": MC
      "5": MC+
  calculator_level_codes:
