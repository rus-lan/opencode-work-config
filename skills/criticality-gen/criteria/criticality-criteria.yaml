external_refs:
  kind: convention
  status: needs_validation
  rationale: "Внешние документы процесса/методики; в шаблонах не хардкодятся, чтобы инструмент переносился в другой контур/компанию"
  base_url: "https://space.samokat.ru/pages/viewpage.action?pageId="
  # Домены ссылок подтверждения (approve_link). Пусто — проверяется только схема
  # http(s): инструмент не привязан к конкретному Rocket.Chat-инстансу.
  approve_link_domains:
    - rocketchat.samokat.ru
    - chat.samokat.ru
  # Базовый адрес Rocket.Chat для этапа handoff (REST-фолбэк и сборка ссылки
  # на сообщение). Env ROCKETCHAT_URL / RC_URL / ROCKET_BASE_URL переопределяет.
  rocketchat_base: "https://rocketchat.samokat.ru"
  # Шаблон ссылки на GitLab-группу ИС. {contour} и {name} подставляются из кода ИС.
  # Пусто — ссылка на GitLab не собирается (в артефакте ⛔ не заполнено).
  gitlab_group_base: "https://git.ecom.tech/ecom/dev/is/{contour}/{name}"
  # База ссылки на задачу Jira (обратная совместимость): task_link =
  # <jira_browse_base>/browse/<jira_task>. Используется там, где ключ известен,
  # а шаблон `jira_base` не задан.
  jira_browse_base: "https://jira.samokat.ru"
  # Шаблон ссылки на карточку ИС в SSoT. {code} — код ИС. Формат взят дословно
  # из чек-листа публикации (templates/publication.md): адрес не хардкодится в
  # скрипте, чтобы инструмент переносился в другой контур.
  ssot_card_base: "https://ssot.ecom.tech/information-systems/{code}"
  # Шаблон ссылки на задачу Jira. {key} — ключ задачи (`catalog.yaml →
  # jira_task` / `is.yaml → task`). Ключ известен — в публикации печатается
  # ссылка, а не `⛔ не заполнено`.
  jira_base: "https://jira.samokat.ru/browse/{key}"
  # Репозитории, в которых живут публикуемые артефакты. URL — канон здесь:
  # в коде они не хардкодятся, чтобы инструмент переносился в другой контур.
  # `publish` при отсутствии клона dochub печатает готовую команду
  # `git clone <url> <путь> --depth 1` (флаг --clone выполняет её сам),
  # `prepare` проверяет доступность обоих репозиториев (git ls-remote,
  # таймаут 10 с; WARN).
  repos:
    dochub:
      url: "https://git.ecom.tech/ecom/dev/is/ecomtech/dochub/aaac.git"
      branch: "master"
      note: "архитектура dochub: паспорт кладётся в architecture/app/<контур>/<сущность>/"
      # GitLab-инстанс и путь проекта — для проверки открытых MR по паспорту
      # (`make publish` отказывается создавать дубль). Обычно берутся из
      # remote.origin.url клона; эти поля — фолбэк, чтобы проверка работала без
      # правки кода при переносе инструмента в другой контур.
      gitlab_base: "https://git.ecom.tech"
      gitlab_project: "ecom/dev/is/ecomtech/dochub/aaac"
    ssot:
      url: "ssh://git@git.ecom.tech:5022/ecom/infrastructure/products-and-services/ssot/ecomtech/data-storage.git"
      branch: "master"
      note: "SSoT: severity ИС в entities/information-systems/<код>/base.yaml"
      gitlab_base: "https://git.ecom.tech"
      gitlab_project: "ecom/infrastructure/products-and-services/ssot/ecomtech/data-storage"
  refs:
    publication_page:
      id: 4553986100
