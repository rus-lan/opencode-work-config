# Критерии оценки критичности ИС — ЕДИНСТВЕННЫЙ машиночитаемый источник правил.
#
# Правила репозитория:
#   * каждое правило обязано иметь поле kind (documented | convention);
#   * kind = documented  — дословно из Confluence, обязателен page_id/source_page_id;
#   * kind = convention  — инженерное решение репозитория, которого нет в источнике:
#                         обязательны rationale и status (needs_validation | validated);
#   * менять правила можно ТОЛЬКО здесь; после правки — `make criteria-check`
#     и `make selftest`, плюс обновление docs/08-criteria.md.
#
# Файл написан в блок-стиле YAML без inline-словарей и без многострочных
# скаляров: его обязан разобрать встроенный мини-парсер scripts/criticality.py
# (PyYAML опционален, поведение обоих путей идентично).
#
# Разбор правил: docs/08-criteria.md
# Проверка: python3 scripts/criticality.py criteria check

schema_version: 1

meta:
  name: Критерии оценки критичности ИС
