    numbers: "Числа расчёта (коэффициенты, интервалы, матрицы, веса, границы) — только этот файл; в документации допустимы зеркала с явной пометкой «копия, канон — criteria» и обязательной сверкой `make docs-check`."
    formulas: "Нарратив формул E/t, интервалы, выбор сценария, границы CIA, маппинг уровней и правило «итог — ячейка final_matrix, не max» — 4566730084."
    inputs: "Требования к семи входам: откуда брать, кто подтверждает, варианты заполнения — 4567543163."
    provenance: "Типы провенанса, статусы missing/derived/confirmed, запреты и что делать без данных — 4567212024."
    artifacts: "Артефакты заполнения паспорта: экспресс — 4552328348, детальная оценка — 4567543163."
    artifacts_note: "Прежняя страница детальной оценки 4566714956 удалена 2026-11-24 (тело пустое, live GET → 404), поэтому детальный сценарий документируется на 4567543163."
