      "MC+": Mission critical+
  deviations_from_artifact:
    - "Пустой SLA в xlsx трактуется как 0 (арифметика Excel). В скилле object_sla обязателен (blocking), но значение 0 допустимо и означает «простой недопустим»: расчёт идёт с t = порог/E×60 + 0 и сопровождается WARN о крайнем уровне."
    - "Пустые клиенты/тип клиентов/влияние в xlsx дают E = 0 и уровень #N/A. В скилле это BLOCKED (IncompleteError), а не «нет уровня»."
    - "«MC+» — только dochub-уровень калькулятора; в паспорт пишется SSoT-уровень Mission critical (levels.dochub_to_ssot), «калькулятор: MC+» сохраняется в trace."
    - "Значения enum в xlsx содержат хвостовые и двойные пробелы; поиск в скилле сравнивает канонические значения (strip + схлопывание пробелов)."
  numerics:
    kind: convention
    status: validated
    rationale: "Округление t до 9 знаков перед сравнением с границами интервалов: FP-дрейф (100/3021.12*60) иначе переключал бы границу (t=240.00000000000003 уходил бы в интервал #4 вместо #3). 9 знаков не меняют ни одного реального значения SLA/нагрузки и совпадают с точностью LibreOffice-сверки."
    round_digits: 9
  validation_required: "Экспресс-результат имеет статус preliminary и требует подтверждения SRE."

