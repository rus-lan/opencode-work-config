      "Клиент не получил кредитные средства в заявленный срок (Внешние клиенты)": Среднее
      "Не получен доступ ко своим счетам, не смог осуществить сделку (Внешние клиенты)": Высокое
      "Клиент понес прямой убыток из-за недоступности сервиса (Внешние клиенты)": Критическое
