inputs:
  kind: documented
  page_id: 4567543163
  # Метаданные процесса (что это, зачем, где взять, у кого) — не цитата из
  # методики, а конвенция репозитория: см. docs/12-requirements.md.
  guidance_kind: convention
  guidance_status: needs_validation
  guidance_rationale: "Формулировки «что это / зачем / где взять / у кого / как подтвердить» — инженерное решение репозитория: канон 4567543163 задаёт сами входы, варианты заполнения и подтверждающих, правило гейта — 4567543163."
  # У каждого входа обязательны поля (проверяет `criteria check`):
  #   method      — detailed | express | both — к какому набору относится вход;
  #   blocking    — true | false — блокирует ли отсутствие значения расчёт
  #                 выбранным сценарием;
  #   switches_scenario — true у входов, заполнение которых переключает ИС на
  #                 сложный сценарий (axes_scores, time_to_impact, cia);
  #   source_page_id — страница-канон требования к входу (4567543163);
  #                 дополнительные страницы маршрута — в самом where;
  #   title/definition/why/acceptable/where/whom/confirm/example — пояснение
  #                 для человека, который будет заполнять DATA-REQUIREMENTS.yaml.
  # Сценарии и правило выбора — секция `scenarios` ниже: простой сценарий
  # (экспресс-оценка) блокируют четыре входа калькулятора, сложный — все
  # `inputs.required`. Неполный сложный набор — BLOCKED, фолбэк на простой
  # сценарий запрещён; поле `method` остаётся для расчёта и для скилла без
  # секции `scenarios`.
  # blocking: false — advisory: не блокирует уровень, но попадает в WARN
  # «не заполнено, требуется для полноты паспорта».
  required:
    - id: peak_hour_load
      title: "Пиковая нагрузка"
      description: "Число клиентов/транзакций за час пиковой нагрузки"
      definition: "Сколько клиентов или транзакций обслуживается за час пиковой нагрузки. Целое число, единица — клиентов/час. Пример: 1200."
      why: "Блокирующий вход экспресс-метода: множитель в E = коэф. типа клиентов × коэф. влияния × клиентов/час; без нагрузки E = 0 и уровень не определяется. Дополнительно заполняет object_workload паспорта."
      acceptable: "Целое число больше 0, клиентов/час (запросов/час, если нагрузка снята как RPS шлюза)"
      where: "Клоны сервисов ИС (apps/<код>/<сервис>): docs/ и openspec/ — основная документация; затем Grafana: папка продукта E001 (uid feuw533xc1hq8c) → подпапка ИС → панели трафика шлюза (rate(http_*), nginx_vts, krakend); вторично — Confluence: страницы трафика/RPS/QPS дерева от страницы ИС; SSoT links.yaml/resources.yaml даёт только ссылки на дашборды. Формула: peak_hour_load = peak_rps × 3600. Ловушка: не экстраполировать 5-минутку — она дала 394 536/час против контрольного increase(counter[1h]) = 42 367/час; при съёме RPS считать peak_rps × 3600"
      whom: "TL (снимает пик в Grafana), SRE (подтверждает панель и datasource)"
      confirm: "source: {type: grafana, ref: 'dashboard uid=<uid>, panel <id>, datasource <uid>, expr: <точный PromQL>, окно 7d/30d'} + status: confirmed или derived с формулой"
      example: "peak_hour_load: {value: 75528, unit: запросов/час, source: {type: grafana, ref: 'dashboard uid=ermmm_20250813_2, panel 64, expr: sum(rate(http_server_duration_count{namespace=\"erm\", env=\"prod\"}[5m]))'}, status: derived}"
      used_by: [express]
      method: express
      blocking: true
      source_page_id: 4567543163
      source_hint: "Grafana E001, панели трафика шлюза; Confluence; TL"
    - id: consumers_type
      title: "Тип клиентов"
      description: "Тип клиентов, затронутых простоем"
      definition: "Категория клиентов, которые заметят простой. Одно значение из enum_selection.consumers_type.values, дословно."
      why: "Блокирующий вход экспресс-метода: множитель в E = коэф. типа клиентов × коэф. влияния × клиентов/час (коэффициент берётся из express_method.client_coefficients). Дополнительно заполняет object_consumers_type паспорта и §3 CRITICALITY.md."
      acceptable: "enum: enum_selection.consumers_type.values (7 значений, дословно)"
      where: "Клоны сервисов ИС (apps/<код>/<сервис>): docs/ и openspec/ — основная документация; затем Confluence: страница ИС и её дерево (BFS до глубины 2) — раздел «Пользователи продукта» / «Про продукт»; Product scope продукта (catalog.yaml → product_scope_page_id) — функциональные области называют потребителей; вторично — SSoT base.yaml (title, description). Значение — дословно из enum_selection.consumers_type.values; описывается наиболее негативный сценарий (selection_rule)"
      whom: "PdM (владелец продукта), TL (техническая сверка)"
      confirm: "source: {type: confluence, ref: 'page_id=<id>, раздел «Пользователи продукта»'} + status: confirmed"
      example: "consumers_type: {value: 'Сотрудники компаний Группы (Внутренние клиенты)', source: {type: confluence, ref: 'page_id=<id>, раздел «Пользователи продукта»'}, status: confirmed}"
      used_by: [express]
      method: express
      blocking: true
      source_page_id: 4567543163
      source_hint: "Confluence: дерево страницы ИС, Product scope, PdM"
    - id: outage_impact
      title: "Влияние при простое"
      description: "Характер влияния при недоступности"
      definition: "Что именно происходит с клиентом при недоступности ИС. Одно значение из enum_selection.outage_impact.values, дословно."
      why: "Блокирующий вход экспресс-метода: коэффициент влияния (express_method.impact_coefficients) — второй множитель в E = коэф. типа × коэф. влияния × клиентов/час; из E считаются t по всем четырём порогам."
      acceptable: "enum: enum_selection.outage_impact.values (6 значений, дословно)"
      where: "Клоны сервисов ИС (apps/<код>/<сервис>): docs/ и openspec/ — основная документация; затем Confluence: DR-страница ИС (catalog.yaml → dr_page_id) — раздел влияния и сценарии отказа; DRP-план ИС (реестр ИС 4541626830, колонка «Ссылка на DRP план»; шаблон 4545516731) — описание последствий и режимов деградации; затем Support-страница и описание E2E. Формулировка — дословно из enum_selection.outage_impact.values; косвенные признаки («операторы не работают») значением не являются — нужна цитата или решение PdM"
      whom: "PdM (характер влияния), TL (техническая реализуемость)"
      confirm: "source: {type: confluence, ref: 'page_id=<id>, раздел <название>'} + status: confirmed; решение PdM при отсутствии цитаты — manual с ref на решение (provenance.manual_decision)"
      example: "outage_impact: {value: 'Не оказана услуга в заявленный SLA срок (Внутренние и Внешние клиенты)', source: {type: confluence, ref: 'page_id=<id>, раздел «Влияние»'}, status: confirmed}"
      used_by: [express]
      method: express
      blocking: true
      source_page_id: 4567543163
      source_hint: "Confluence: DR-страница ИС, DRP-план, E2E; PdM"
    - id: object_sla
      title: "Допустимое время простоя (SLA)"
      description: "Допустимое время простоя (SLA), минуты"
      definition: "Допустимое время недоступности ИС в минутах (SLA/RTO). Целое число >= 0: 0 — простой недопустим (последствия наступают немедленно), отрицательных значений не бывает. Пример: 60."
      why: "Блокирующий вход экспресс-метода: прибавляется к каждому t = порог/E×60 + SLA, то есть сдвигает все четыре времени наступления последствий и через интервалы меняет уровень. Без SLA уровень не считается (в xlsx пустой SLA молча равен 0 — отклонение зафиксировано в express_method.deviations_from_artifact)."
      acceptable: "Целое число минут >= 0 (0 = простой недопустим; отрицательные запрещены)"
      where: "Клоны сервисов ИС (apps/<код>/<сервис>): docs/ и openspec/ — основная документация; затем Confluence: Support-страница ИС — «целевое время решения» / «SLA решения», раздел «Классификация инцидентов»; DR-страница — «допустимое время простоя» / RTO; SLA в договоре с потребителем. Новый источник — фреймворк НФТ 4433941403: TIER-1 SLA ≥ 99,95 %/мес, RTO ≤ 60 мин, RPO ≤ 240 мин; TIER-2 SLA ≥ 99,5 %; TIER-3 SLA ≥ 99,0 %; TIER берётся из реестра ИС 4541626830, колонка «TIER DR (0,1,2,3)». Обязательная оговорка: TIER ≠ уровень критичности 1:1, перенос подтверждает SRE. RTO в часах — другой норматив: переводить в минуты можно только с подтверждением SRE; процент доступности (99.x) не равен простою в минутах"
      whom: "SRE (владелец норматива), Support (SLA инцидентов)"
      confirm: "source: {type: confluence, ref: 'page_id=<id>, таблица «Классификация инцидентов»'} + status: confirmed или derived с формулой (например 4h × 60 = 240 мин)"
      example: "object_sla: {value: 240, unit: мин, source: {type: confluence, ref: 'page_id=<id>, «SLA решения 4h»'}, status: derived}"
      used_by: [express]
      method: express
      blocking: true
      source_page_id: 4567543163
      additional_source_page_ids: [4433941403]
      source_hint: "Confluence: Support-страница (SLA решения), DR-страница (RTO), фреймворк НФТ (TIER); SRE"
    - id: axes_scores
      title: "Оценки по осям (0..4)"
      description: "Оценки 0..4 по осям legal/economic/reputational/client"
      definition: "Четыре целых оценки 0..4 — по одной на ось legal, economic, reputational, client. Что означает каждая оценка — axes.items[].scale."
      why: "Блокирующий вход детального метода: max по осям — строка impact_matrix, вместе с time_to_impact даёт бизнес-уровень, а он через final_matrix — итоговую критичность."
      acceptable: "четыре целых 0..4; шкалы — axes.items[].scale"
      where: "Клоны сервисов ИС (apps/<код>/<сервис>): docs/ и openspec/ — основная документация; затем Экспертно — из документов не выводится: legal — юридическая оценка, economic — финансовая модель, reputational — ИБ и PR, client — клиентские метрики. Страница критичности даёт только итоговый уровень, разбивки по осям в ней нет; ссылка на страницу критичности подтверждением осей не считается; нагрузки и SLA осей не заменяют"
      whom: "TL (сбор), ИБ, финансы, PdM"
      confirm: "source: {type: manual, ref: 'TL + ИБ + финансы, протокол/встреча <дата>'} + status: confirmed"
      example: "axes_scores: {legal: 3, economic: 2, reputational: 1, client: 4, source: {type: manual, ref: 'TL + ИБ + финансы'}, status: confirmed}"
      used_by: [detailed]
      method: detailed
      blocking: true
      switches_scenario: true
      source_page_id: 4567543163
      source_hint: "экспертная оценка: TL + ИБ + финансы"
    - id: time_to_impact
      title: "Время до последствий"
      description: "Время до наступления негативных последствий"
      definition: "Через сколько времени простой начнёт давать неприемлемый ущерб. Одна корзина из time_buckets.order: <1h, 1-12h, 12-24h, >24h."
      why: "Блокирующий вход детального метода: колонка impact_matrix; вместе с max по осям даёт бизнес-уровень критичности."
      acceptable: "enum: time_buckets.order (<1h | 1-12h | 12-24h | >24h)"
      where: "Клоны сервисов ИС (apps/<код>/<сервис>): docs/ и openspec/ — основная документация; затем Confluence: DR-страница ИС — сценарии отказа, кеш, репликация, очередь, момент наступления последствий; DRP-план ИС (реестр ИС 4541626830, колонка «Ссылка на DRP план»; шаблон 4545516731) — целевые сроки восстановления; разбор фактических инцидентов. Норматив в источнике обязателен: «последствия мгновенные» без зафиксированного окна — не значение"
      whom: "SRE (сценарий отказа), TL (архитектура: кеш, репликация, очередь)"
      confirm: "source: {type: confluence, ref: 'page_id=<id>, сценарий <название>'} + status: confirmed"
      example: "time_to_impact: {bucket: '<1h', source: {type: confluence, ref: 'page_id=<id>, сценарий <название>'}, status: confirmed}"
      used_by: [detailed]
      method: detailed
      blocking: true
      switches_scenario: true
      source_page_id: 4567543163
      source_hint: "Confluence: DR-страница ИС, DRP-план, сценарии простоя; SRE"
    - id: cia
      title: "Оценки CIA"
      description: "Оценки C/I/A (low|medium|high)"
      definition: "Три уровня low|medium|high для конфиденциальности (C), целостности (I) и доступности (A). Что означает уровень — cia.descriptions."
      why: "Блокирующий вход детального метода: cia.weights и формула V = 6*(F(C)+F(I)+F(A)) дают уровень защищённости, который через final_matrix участвует в итоговой критичности."
      acceptable: "enum: low | medium | high для каждого из C, I, A (cia.levels)"
      where: "Клоны сервисов ИС (apps/<код>/<сервис>): docs/ и openspec/ — основная документация; затем ИБ: классификация данных и модель угроз; связанный источник 4566723467 (методика для целей ИБ) — категории данных 5 классов; facts.data_classification в INFORMATION.yaml; уровни ПДн по полям API из ADR (если есть). Оговорка: 5 классов методики ИБ ≠ low/medium/high, подставлять напрямую нельзя — нужна экспертиза ИБ; «УЗ-N» в cia — ошибка: уровень защищённости НДС на класс критичности не влияет. Из страницы ИС и SSoT-карточки CIA не выводится — отметок конфиденциальности/целостности/доступности там нет"
      whom: "ИБ (владелец классификации)"
      confirm: "source: {type: manual, ref: 'ИБ: <логин>'} + status: confirmed"
      example: "cia: {c: high, i: medium, a: low, source: {type: manual, ref: 'ИБ: <логин>'}, status: confirmed}"
      used_by: [detailed]
      method: detailed
      blocking: true
      switches_scenario: true
      source_page_id: 4567543163
      additional_source_page_ids: [4566723467]
      source_hint: "экспертная оценка ИБ + facts.data_classification + 4566723467"
  optional:
    - id: financial_loss
      title: "Финансовые потери по сценариям"
      description: "Финансовые потери по сценариям"
      definition: "Денежная оценка потерь по сценариям простоя (рубли). Свободный текст с числом и периодом."
      why: "В формулу уровня не входит: обогащает обоснование критичности; без него соответствующий раздел паспорта остаётся «не заполнено»."
      acceptable: "Сценарий + сумма в рублях; в остальных полях — свободный текст"
      where: "Финансовая модель продукта и расчёты PdM; вход — сценарии простоя из DR-страницы ИС. Пороги калькулятора: низкий — до 1 млн, средний — 1–10 млн, высокий — 10–50 млн, неприемлемый — свыше 50 млн (руб.)"
      whom: "PdM, финансы"
      confirm: "source: {type: manual, ref: '<логин>'} + status: confirmed"
      example: "financial_loss: {value: '1 млн руб/час простоя', source: {type: manual, ref: 'PdM: Smirnov'}, status: confirmed}"
      used_by: [detailed]
      source_page_id: 4567543163
      source_hint: "финансовая модель"
      queries:
        - 'text ~ "потери GMV"'
        - 'text ~ "недополученного GMV"'
        - 'title ~ "финансовая модель" AND text ~ "{product}"'
        - 'text ~ "{is_code}" AND (text ~ "ущерб" OR text ~ "потери")'
        - 'title ~ "постмортем" AND text ~ "{is_name}"'
      applicability_check:
        question: "Обслуживает ли ИС внешних клиентов / заказы?"
        source: "DR-страница ИС (catalog.yaml → dr_page_id), раздел про клиентов"
        if_no: 'Потери GMV от заказов к ИС не относятся: ИС внутренняя. Кандидат значения — `0 руб/час` со ссылкой на DR-страницу и прецедент (4417913261 «Отсутствуют потери, нет влияния на GMV… продукт внутреннего использования»). Не подставлять общесетевой GMV и не выводить «примерно».'
      methodology_refs:
        - id: 4261521386
          title: "Расчет недополученного GMV от КРИТИЧЕСКИХ технологических инцидентов"
          note: "Формула: (отмены во время инцидента − среднее за 3 недели) × средний чек; средний чек по умолчанию 750 ₽. Применима только к ИС, обслуживающим заказы клиентов."
      precedent_refs:
        - id: 4196617026
          note: "mask-kpr.smkt: «потеря менее 1% GMV»"
        - id: 4417913261
          note: "fdbk.ecom: внутренняя ИС → потерь нет"
        - id: 4417940072
          note: "sbc.ecom: «отсутствие потери GMV»"
      traps:
        - "Блок «Оценка ущерба» в постмортемах T006 — пустой шаблон, не данные."
        - "Дашборд Grafana WjUcCb_Zz «GMV, AOV, Conversion» — общесетевой GMV, не атрибутируется ИС; как потери ИС не использовать."
      advisory: true
      source_status: current
  # Маршруты поиска без собственного входа расчёта: не блокируют уровень, не
  # входят в scenarios и не участвуют в гейте. Их читает агент на tier 2, когда
  # входа нет в criteria.inputs.required/optional, но подтверждение нужно для
  # паспорта. Канон запросов — здесь; references/search.md держит копию.
  routes:
    e2e:
      kind: convention
      status: needs_validation
      rationale: "Маршрут найден глубоким поиском 2026-11-18 (метки checkliste2e / e2e-process-card, реестры процессов) и не описан в каноне входов 4567543163: страница-канон задаёт требования к семи входам, но не маршрут сквозных процессов. Пока владелец методики не подтвердил, правило помечено конвенцией."
      title: "Сквозные процессы (e2e)"
      description: "Участие ИС в сквозных бизнес-процессах: карточка процесса и место ИС в шагах"
      where: 'Каталог сквозных процессов: «🗃 Каталог сквозных процессов 2.0» (3790195333), «Реестр сквозных процессов» (3700777856), «Реестр информационных систем» (4060332274, колонки «Наименование ИС / Код ИС / Название процесса»). Прямой запрос по ИС — метка таблицы шагов процесса: label = "checkliste2e" AND text ~ "<код ИС>". Карточки процессов — label = "e2e-process-card" AND space = SMKT. Ловушка: пустая колонка "Сквозной бизнес-процесс (e2e)" в Product scope НЕ означает отсутствие процессов: в таблице-глоссарии стоит пометка "В рамках пилота не заполняем". Опустевшая колонка — повод идти в каталог процессов, а не основание для not_filled.'
      queries:
        - 'label = "checkliste2e" AND text ~ "{is_code}"'
        - 'label = "e2e-process-card" AND space = SMKT AND text ~ "{is_name}"'
        - 'text ~ "{is_code}" AND title ~ "BP"'
        - 'text ~ "{is_name}" AND text ~ "сквозной процесс"'
      evidence_grading:
        direct: "код ИС присутствует в колонке «Информационная система» таблицы шагов процесса"
        indirect: "ИС упомянута как получатель данных или в описании, но не в шагах"
        none: "совпадений нет"
      record_steps: true
      # Реестры входа перечислены явно: без этого `_research_ref_pages`
      # подбирает их эвристикой по вхождению title в `where`, и правка
      # формулировки молча отключает покрытие.
      external_refs: [e2e_catalog, e2e_registry, is_process_registry]
      source_page_id: 4567543163
      source_status: current
  gate:
    kind: documented
    page_id: 4567543163
    source_quote: "Если задан хотя бы один вход детального набора, метод — детальный. Фолбэк на экспресс запрещён: неполный детальный набор блокирует оценку."
    source_note: "Прежняя атрибуция на 4566730084 (v13) дословно не подтверждается: слов BLOCKED/blocking/missing на странице нет (0 вхождений). Цитата живёт на 4567543163 (v13)."
    rule: "Если хотя бы один обязательный критерий недоступен — расчёт не выполняется, возвращается статус incomplete со списком недостающих критериев и требованием указать источник или значение."

scenarios:
  kind: convention
  status: validated
  rationale: "Критичность считается по двум сценариям. Простой (экспресс) — четыре входа калькулятора критичности. Сложный (детальная оценка) — все входы блока inputs обязательны: частично заполненный детальный набор не даёт права на расчёт."
  simple:
    title: "Простой сценарий (экспресс-оценка)"
    method: express
    inputs:
      - peak_hour_load
      - consumers_type
      - outage_impact
      - object_sla
    rule: "Все четыре входа обязательны и должны иметь непустое значение. Отсутствие любого — BLOCKED."
  complex:
    title: "Сложный сценарий (детальная оценка)"
    method: detailed
    inputs:
      - peak_hour_load
      - consumers_type
      - outage_impact
      - object_sla
      - time_to_impact
      - axes_scores
      - cia
    rule: "Все входы блока inputs обязательны. Отсутствие любого — BLOCKED; фолбэк на простой сценарий запрещён."
  selection:
    source_page_id: 4566730084
    rule: "Если хотя бы один вход, относящийся только к сложному набору (time_to_impact, axes_scores, cia), содержит непустое значение — сценарий сложный. Иначе — простой."

service_lifecycle:
  kind: convention
  status: validated
  rationale: "Сервисы с lifecycle: closed выведены из эксплуатации и не участвуют в функционировании ИС. Их нельзя клонировать, анализировать и использовать как источник оснований для входов критичности."
  skip:
    - closed
  skip_reason: "сервис закрыт (lifecycle: closed): удалён из эксплуатации, не участвует в функционировании ИС"
  applies_to:
    - prepare
    - collect
    - services
  evidence_rule: "закрытый сервис не может быть источником для criteria_inputs и facts"

express_method:
  kind: documented
  status: validated
  source_page_id: 4566730084
  source_artifact: "docs/reference/calculator/калькулятор критичности упрощенный.xlsx"
  source_sheets:
    inputs: "Простой - Экспресс оценка"
    lookup: "Расчет!A50:F56"
    intervals: "Расчет!B9:C14"
    matrix: "Расчет!D26:I29"
    score_to_level: "Расчет!B35:C39"
  note: "Алгоритм перенесён из файла-артефакта дословно: лист «Простой - Экспресс оценка» (C2..C5) -> «Простой - Детальная оценка» строка 5 -> скрытый лист «Расчет» (D33:I33 -> J33 -> K33) -> C7. Макросов в файле нет, все константы лежат в ячейках. Рантайм-зависимости от xlsx нет: коэффициенты, интервалы и матрица продублированы ниже."
  formula:
    kind: documented
    source_artifact: "docs/reference/calculator/калькулятор критичности упрощенный.xlsx"
    load: "E = client_coefficients[consumers_type] × impact_coefficients[outage_impact] × peak_hour_load"
    time: "t[severity] = thresholds[severity] / E × 60 + object_sla"
    score: "score[interval] = matrix[severity][interval] первой severity из matrix.rows, для которой lo < t[severity] <= hi"
    level: "J = max(score по интервалам); level = score_to_level[J]"
  aggregation: max
  thresholds:
    Неприемлемые: 50000
    Высокие: 10000
    Средние: 1000
    Низкие: 100
  client_coefficients:
    kind: documented
    source_artifact: "docs/reference/calculator/калькулятор критичности упрощенный.xlsx"
    note: "Расчет!A50:B56; в xlsx у «Физические  лица канала Сбербанк Первый» двойной пробел — в enum_selection.consumers_type.values значение канонизировано, поиск сравнивает без учёта краевых/двойных пробелов."
    map:
      "Физические лица (Внешние клиенты)": 1
      "Микро/малый бизнес (Внешние клиенты)": 1
      "Крупный и средний бизнес (Внешние клиенты)": 10
      "Крупнейшие клиенты и финансовые институты (Внешние клиенты)": 100
      "Физические лица канала Сбербанк Первый (Внешние клиенты)": 10
      "Физические и юридические лица канала Private banking (Внешние клиенты)": 20
      "Сотрудники компаний Группы (Внутренние клиенты)": 0.2
  impact_coefficients:
    kind: documented
    source_artifact: "docs/reference/calculator/калькулятор критичности упрощенный.xlsx"
    note: "Расчет!D51:F56 (столбец F — коэффициент). В xlsx у первых двух значений реальный хвостовой пробел, у «Клиент не получил кредитные средства…» — двойной; в enum_selection.outage_impact.values значения канонизированы, поиск сравнивает без учёта краевых/двойных пробелов."
    map:
      "Клиент не смог узнать необходимую информацию (Внутренние и внешние клиенты)": 0.2
      "Не оказана услуга в ожидаемый срок, без нарушения SLA (Внутренние и внешние клиенты)": 0.5
      "Не оказана услуга в заявленный SLA срок (Внутренние и Внешние клиенты)": 0.8
      "Клиент не получил кредитные средства в заявленный срок (Внешние клиенты)": 1.0
      "Не получен доступ ко своим счетам, не смог осуществить сделку (Внешние клиенты)": 1.5
      "Клиент понес прямой убыток из-за недоступности сервиса (Внешние клиенты)": 3.0
