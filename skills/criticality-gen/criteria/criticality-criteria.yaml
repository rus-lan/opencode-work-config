    note: "Расчет!E51:E56 — категория последствий для человека; на расчёт не влияет."
    map:
      "Клиент не смог узнать необходимую информацию (Внутренние и внешние клиенты)": Незначительное
      "Не оказана услуга в ожидаемый срок, без нарушения SLA (Внутренние и внешние клиенты)": Низкое
