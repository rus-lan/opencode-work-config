conflicts:
  kind: convention
  status: needs_validation
  rationale: "Источники могут расходиться (SSoT, страница критичности Confluence, dochub-паспорт, E2E-описание)."
  priority: [dochub_passport, criticality_page, ssot_card]
  on_conflict: "Зафиксировать расхождение в артефакте (раздел «Расхождения»), выбрать значение по приоритету, пометить статус требует подтверждения."

