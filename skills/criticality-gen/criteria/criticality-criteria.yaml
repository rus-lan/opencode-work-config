    Business critical: "Остановка ведёт к значительным финансовым/репутационным потерям"
    Business operational: "Влияет на эффективность, но кратковременные простои не критичны"
    Office productivity: "Не влияют на бизнес-процессы"
  dochub_extra_level:
    value: "Mission critical+"
    kind: documented
    source_page_id: 4566730084
    note: "Существует только в dochub-паспорте. Методикой не производится: балл 5 калькулятора даёт Mission critical в паспорте и SSoT, MC+ сохраняется только в трассировке (calculator_level)."
    mapping_to_ssot: "Mission critical"
  dochub_to_ssot:
    kind: documented
    page_id: 4566730084
    map:
      "Office productivity": "Business operational"
      "Business operational": "Business operational"
      "Business critical": "Business critical"
      "Mission critical": "Mission critical"
      "Mission critical+": "Mission critical"
  publish_enum:
    kind: convention
    status: validated
    rationale: "Enum паспорта в dochub (_metamodel_/ecom/entities/app/criticality.yaml → $defs.sber.ecom.criticality_enum) записан в ВЕРХНЕМ регистре и не совпадает с Title Case levels.order. Маппинг нужен только на этапе публикации (make publish): в самом паспорте уровня Title Case остаётся, иначе make validate его не примет. Значения повторяют functions/criticality.yaml → ecom_criticality_calc."
    enum:
      - НЕ ОЦЕНЕНО
      - MISSION CRITICAL
      - BUSINESS CRITICAL
      - BUSINESS OPERATIONAL
    map:
      "": НЕ ОЦЕНЕНО
      "Office productivity": BUSINESS OPERATIONAL
      "Business operational": BUSINESS OPERATIONAL
      "Business critical": BUSINESS CRITICAL
      "Mission critical": MISSION CRITICAL
      "Mission critical+": MISSION CRITICAL
  ssot_enum:
    kind: convention
    status: validated
    rationale: "Enum severity.type в SSoT (schemas/information-systems/base.schema.json) записан kebab-case и содержит три значения. Уровень Office productivity методикой производится, но в SSoT отсутствует — публикуется как business-operational (это же следует из ssot_severity_normalization: office-productivity → Office productivity). Маппинг нужен только на этапе обогащения SSoT (make ssot-plan): в паспорте уровень остаётся Title Case, иначе make validate его не примет."
    enum:
      - mission-critical
      - business-critical
      - business-operational
    map:
      "Office productivity": business-operational
      "Business operational": business-operational
      "Business critical": business-critical
      "Mission critical": mission-critical
      "Mission critical+": mission-critical

