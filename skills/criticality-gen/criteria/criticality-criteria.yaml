cia:
  kind: documented
  page_id: 4207454433
  source_status: archived_carrier
  source_note: "Параметры C/I/A, описания и веса — единственный носитель (страница в архиве)."
  parameters: [C, I, A]
  levels: [low, medium, high]
  descriptions:
    kind: documented
    page_id: 4207454433
    source_status: archived_carrier
    source_note: "Описания уровней C/I/A — единственный носитель; страница в архиве, но заменить таблицу нечем."
    note: "Единственный носитель описаний уровней; страница в архиве — при изменении методики перенести таблицу в 4566730084."
    C:
      low: "Утечка общедоступных данных"
      medium: "Утечка данных для внутреннего пользования, не содержащих КИ (внутренние документы, отчеты и т.п.)"
      high: "Утечка конфиденциальной информации (базы клиентов/работников, условия договоров, отчеты и т.п.)"
    I:
      low: "Незначительные ошибки/изменения"
      medium: "Серьезный ущерб (<24 ч.)"
      high: "Критические искажения (за последние 24 ч)"
    A:
      low: "Утечка общедоступных данных"
      medium: "Искажение незначимых данных"
      high: "Простой <4 часов"
      source_defect: true
      note: "Формулировки в источнике дублируют ось C и не описывают доступность. Приведены дословно; применение требует подтверждения владельца методики."
  weights:
    kind: documented
    page_id: 4207454433
    source_status: archived_carrier
    source_note: "Веса F(low/medium/high) — единственный носитель; страница в архиве, при изменении методики переносить в 4566730084."
    note: "Единственный носитель весов F(low/medium/high); страница в архиве — при изменении методики перенести таблицу в 4566730084."
    low: 0.1
    medium: 0.22
    high: 0.56
  # Границы V для уровней защищённости. Дублируют protection_levels.ranges
  # намеренно: это единственный ключ, из которого рендерятся артефакты
  # (templates/CRITICALITY.md, reassessment). Согласованность с ranges
  # проверяет `criteria check` — правьте оба места или ни одного.
  thresholds:
    kind: documented
    source_page_id: 4566730084
    low_upper: 2.8
    medium_upper: 5.6
    high_upper: 8.0
  formula: "V = 6*(F(C)+F(I)+F(A))"
  protection_levels:
    kind: documented
    source_page_id: 4566730084
    note: "Источник: V < 2.8 -> Low; 2.8 <= V < 5.6 -> Medium; 5.6 <= V < 8 -> High; V > 8 -> Critical. В ranges граница V = 8 отнесена к Critical — отклонение зафиксировано в boundary_convention."
    ranges:
      - level: Low
        min: null
        max: 2.8
        max_inclusive: false
      - level: Medium
        min: 2.8
        max: 5.6
        max_inclusive: false
      - level: High
        min: 5.6
        max: 8.0
        max_inclusive: false
      - level: Critical
        min: 8.0
        max: null
        max_inclusive: true
    boundary_convention:
      kind: convention
      status: needs_validation
      source_page_id: 4566730084
      rationale: "Источник задаёт V > 8, оставляя V = 8 без уровня. Принято V >= 8 -> Critical, чтобы границы были полными."
  protection_to_level:
    kind: documented
    page_id: 4207454433
    source_status: archived_carrier
    source_note: "Маппинг «уровень защищённости → бизнес-шкала» — единственный носитель (страница в архиве)."
    map:
      Low: Office productivity
      Medium: Business operational
      High: Business critical
      Critical: Mission critical

