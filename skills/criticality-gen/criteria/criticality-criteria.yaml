handoff:
  kind: convention
  status: needs_validation
  rationale: "Параметры канала передачи треда человеку: имя канала, срок ожидания ответа MCP и дедупликация при фолбэке на REST. В методике D6.1.1 канал и таймауты не заданы — это инженерное решение инструмента, вынесенное из кода, чтобы перенос в другой контур менял только файл критериев."
  # Канал треда (без # или с # — принимается оба вида). Значение по умолчанию
  # в скрипте (#Criticality_assessment) — фолбэк, а не канон.
  channel: "Criticality_assessment"
  # Сколько секунд ждать ответа MCP-исполнителя. Истёк срок — MCP считается
  # нерабочим, handoff автоматически уходит в REST (fallback_reason: mcp_timeout).
  mcp_timeout_seconds: 120
  # Дедупликация при фолбэке: сколько последних сообщений канала смотреть и
  # сколько первых символов текста сравнивать (плюс автор сообщения).
  message_search_count: 20
  message_match_prefix: 80

provenance:
  kind: documented
  page_id: 4567212024
  note: "Канон типов провенанса и статусов значения. Тип без описания не принимается: `enrich` сверяет source.type со списком ниже."
  # Типы провенанса в порядке канона. Список обязан совпадать с
  # PROVENANCE_TYPES в scripts/criticality.py — и по составу, и по порядку.
  types:
    - name: ssot
      description: "Файл SSoT-репозитория"
    - name: is_yaml_override
      description: "Переопределение из локального is.yaml"
    - name: catalog
      description: "Поле реестра репозитория"
    - name: confluence
      description: "Страница: page_id и раздел"
    - name: gitlab
      description: "Репозиторий, файл с номером строки или MR"
    - name: jira
      description: "Задача"
    - name: grafana
      description: "Дашборд, панель, точный запрос"
    - name: attachment
      description: "Вложение Confluence (таблица, выгрузка, калькулятор)"
    - name: ssot_links
      description: "Ссылка из карточки ИС в SSoT (links.yaml)"
    - name: manual
      description: "Ручное значение, подтверждённое человеком"
  # Решение владельца — не цитата: без ссылки на само решение это missing.
  manual_decision:
    kind: documented
    page_id: 4567212024
    rule: "Решение владельца без дословной цитаты — это manual с ref вида «решение PdM, <YYYY-MM-DD>; INFORMATION.yaml#notes». Без ссылки на решение — missing, а не manual."
    check_note: "Формат ref «решение PdM, <YYYY-MM-DD>» проверяется человеком, а не механикой: ref — свободный текст, `enrich` и `criteria check` его не разбирают. Механической проверки здесь нет намеренно."

