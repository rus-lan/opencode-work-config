  kind: convention
  status: needs_validation
  review_period_months: 12
  rationale: "Процесс D6.1.1 не задаёт срок действия оценки; 12 месяцев — конвенция репозитория для напоминаний."

artifacts:
  kind: convention
  status: needs_validation
  rationale: "Требование к форме артефактов — правило этого репозитория, а не методики: оно гарантирует, что в паспорт не попадут числа без источника."
  rule: "Любой артефакт формируется только из шаблона templates/ и только из фактов INFORMATION.yaml + критериев. Свободный текст допускается только в полях «комментарий/обоснование»."
