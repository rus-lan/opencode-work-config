    evaluation_order: first_match
    rows:
      - severity: Неприемлемые
        scores: [5, 4, 4, 4, 3, 1]
      - severity: Высокие
        scores: [4, 4, 3, 3, 2, 1]
      - severity: Средние
        scores: [3, 3, 2, 2, 1, 1]
      - severity: Низкие
        scores: [2, 2, 2, 1, 1, 1]
  score_to_level:
